version: "3.9"

services:
   app: 
     build: ./app
     ports: 
     -  "3000:3000"
     env_file: 
       - .env
     depends_on:
     -  db
     - redis
   db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD:rootpass
      - MYSQL_DATABASE:testdb
    volumes:
    - mysql_data:/var/lib/mysql
   redis:
      image: redis:7-alpine

volumes:
 mysql_data: 